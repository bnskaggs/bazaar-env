[project]
name = "bazaar-env"
version = "0.1.0"
description = "A short-horizon dealer-market RL environment with deterministic marking, scripted quotes, and exploit-aware rewards."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "bnskaggs" }]
dependencies = [
    # Hosted training installs environment wheels into a shared image that owns
    # the verifiers/prime-sandboxes stack. Keep this wheel a pure plugin over
    # that image; local tooling lives in the dev extra.
    "datasets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "verifiers>=0.3.0,<0.3.1",
    "prime-sandboxes>=0.2.35,<0.2.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar_env"]
include = ["src/bazaar.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "DESIGN.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 2
