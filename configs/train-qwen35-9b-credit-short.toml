# Bazaar run 4a: SHORT credit fine-tune from the v2 maker checkpoint.
#
# Why short. Run 3 (dqp67hcmadgq8t2mhov0247t, 40 steps, $9.83) showed the
# credit gain arrives early and the damage arrives late: batch means peaked at
# step 91 (1.33) and 98 (1.34) then slid to ~1.24-1.26, while maker_micro eval
# fell 1.2792 -> ~1.263 and micro 1.2877 -> 1.2717. The credit eval only had
# two sample points (105, 120), so we never saw whether an early checkpoint
# held the priors while already capturing the credit lift.
#
# Hypothesis: stopping at ~12 new steps captures the credit improvement before
# single-tier training erodes v1/v2 skills. This is a scheduling fix, not a
# training-shape fix — run 4b (mixed) tests the training-shape fix, and both
# run regardless of what this one shows.
#
# Design of the sampling grid: eval AND checkpoint both on interval 4, so
# every eval point (94, 98, 102) has a keepable checkpoint behind it. Run 3's
# failure mode was partly that its best-looking step had no separable
# checkpoint to keep.
#
# Warm start: step-90 checkpoint from run e7naqkjeix1hmqf9eibh264t (the v2
# maker curriculum). At step 90: maker_micro 1.2792, micro 1.2877.
# Baselines to beat on credit_micro: base 9B zero-shot ~1.253 reward
# (terminal 1.003); run 3 best 1.2758; margin_taker anchor ~1.2995.
#
# GOTCHA (magic-sort lesson): max_steps is ABSOLUTE, not incremental.
# 90 -> 102 means 12 new steps.
# Cost sketch: run 3 was $9.83 for 40 steps + 2 triple evals; 12 steps + 3
# triple evals -> ~$3-4.

model = "Qwen/Qwen3.5-9B"
checkpoint_id = "ix2fgbi0csvgvkazkedvmkva"
max_steps = 102
batch_size = 64
rollouts_per_example = 8

[sampling]
max_tokens = 400
enable_thinking = false

[[env]]
id = "bnskaggs/bazaar-env"
args = { tier = "credit_micro" }

[checkpoints]
interval = 4

[eval]
interval = 4
num_examples = 20
rollouts_per_example = 2

[eval.sampling]
max_tokens = 400
temperature = 0.0
enable_thinking = false

[[eval.env]]
name = "credit_micro"
id = "bnskaggs/bazaar-env"
args = { tier = "credit_micro" }

[[eval.env]]
name = "maker_micro"
id = "bnskaggs/bazaar-env"
args = { tier = "maker_micro" }

[[eval.env]]
name = "micro"
id = "bnskaggs/bazaar-env"
args = { tier = "micro" }
